<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECTA+ | Questionário</title>

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/questionario.css">
    <link rel="icon" href="./css/girassol_incluime.png" type="image/png">
</head>

<body>
    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="user">
                <img src="assets/imgs/avatar-do-usuario.png" alt="avatar" id="user_avatar">
                <p id="user_infos">
                    <span id="nome_user" class="item-description"></span>
                    <span id="tipo_user" class="item-description"></span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item active">
                    <a href="questionario.html">
                        <i class="fi fi-rs-note"></i>
                        <span class="item-description">Avalie</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="dashboard.html">
                        <i class="fi fi-rs-stats"></i>
                        <span class="item-description">Dashboard</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="perfil-aluno.html">
                        <i class="fi fi-rs-user"></i>
                        <span class="item-description">Perfil</span>
                    </a>
                </li>
            </ul>

            <button id="abrir">
                <i id="abrir_icon" class="fi fi-rs-angle-small-right"></i>
            </button>


        </div>
        </div>
        <div id="logout">
            <button id="logout_button">
                <i class="fi fi-rs-exit"></i>
                <span class="item-description">Sair</span>
            </button>
        </div>
    </nav>
    <main class="area-questionario">

        <img src="assets/imgs/conecta_logo_transparente.png" width="150px">

        <section class="cabecalho-questionario">
            <h1>Avaliar escola</h1>
            <p>Compartilhe sua experiência.</p>
            <div class="campo">

                <div class="texto-escola-atual" id="escolaAtualTexto"></div>
            </div>
        </section>

      <div class="questionario-layout">

    <section class="card-questionario">
        <h2>Formulário</h2>

        <div class="formulario-questionario">

            <div class="campo-questionario">
                <label>Selecione a nota:</label>
                <select class="select-nota" id="nota">
                    <option value="0">Selecione...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="campo-questionario">
                <label>Comentário</label>
                <textarea class="textarea-comentario" id="comentario"></textarea>
            </div>

            <div id="mensagem_erro" class="msg-validacao"></div>

            <div class="acoes-questionario">
                <button class="botao" id="btnEnviar" onclick="enviar()">Enviar avaliação</button>
                <button class="botao" id="btnAlterar" style="display: none;" onclick="alterarComentario()">
                    Salvar alterações
                </button>
            </div>

            <div id="msg" class="msg-validacao"></div>
        </div>
    </section>

    <aside class="card-avaliacao-lateral" id="cardAvaliacaoAtual" style="display: none;">
        <div class="topo-avaliacao-lateral">
            <h3>Minha avaliação</h3>

            <button class="btn-lixeira-topo" onclick="deletarComentario()" title="Apagar avaliação">
                <i class="fi fi-rs-trash"></i>
            </button>
        </div>

        <div class="bloco-nota">
            <span class="rotulo-avaliacao">Nota</span>
            <div class="nota-destaque" id="notaAtualValor">0</div>
        </div>

        <div class="bloco-comentario">
            <span class="rotulo-avaliacao">Comentário</span>
            <p id="comentarioAtualTexto">Nenhum comentário informado.</p>
        </div>
    </aside>

</div>

    </main>
    <script>

        document.getElementById('abrir_icon').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('open-sidebar');
        });

        var logoutButton = document.getElementById("logout_button");

        logoutButton.addEventListener("click", function () {
            var confirmarSaida = confirm("Tem certeza que deseja sair?");

            if (confirmarSaida) {
                window.location.href = "index.html";
            }
        });

        window.onload = function () {
            var nomeUsuario = sessionStorage.getItem("NOME_USUARIO");
            var sobrenomeUsuario = sessionStorage.getItem("SOBRENOME_USUARIO");
            var nomeCompleto = nomeUsuario + " " + sobrenomeUsuario;
            document.getElementById("nome_user").innerText = nomeCompleto;
            document.getElementById("escolaAtualTexto").innerText = sessionStorage.getItem("ESCOLA_USUARIO");
            document.getElementById("tipo_user").innerText = "Familiar"

            var idUsuarioVar = sessionStorage.getItem("ID_USUARIO");

            fetch(`/avaliacao/buscar/${idUsuarioVar}`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json"
                }
            })
                .then(function (resposta) {

                    if (resposta.ok) {

                        resposta.json().then(function (json) {

                            if (json.length > 0) {
                                console.log(json)
                                nota.value = json[0].nota;
                                comentario.value = json[0].descricao;

         document.getElementById("notaAtualValor").innerText = json[0].nota + "⭐";
document.getElementById("comentarioAtualTexto").innerText =
    json[0].descricao && json[0].descricao.trim() !== ""
        ? json[0].descricao
        : "Nenhum comentário informado.";

document.getElementById("cardAvaliacaoAtual").style.display = "block";
document.getElementById("btnAlterar").style.display = "block";
document.getElementById("btnEnviar").style.display = "none";

mensagem_erro.style.color = "green";
mensagem_erro.innerHTML = "";

                            } else {

                                mensagem_erro.style.color = "red";
                                mensagem_erro.innerHTML = "Você ainda não fez nenhuma avaliação.";
                            }

                        });

                    } else {

                        mensagem_erro.style.color = "red";
                        mensagem_erro.innerHTML = "Erro ao buscar avaliação";
                    }

                })
                .catch(function (erro) {

                    console.log(erro);

                    mensagem_erro.style.color = "red";
                    mensagem_erro.innerHTML = "Erro na requisição";
                });
        }


        function enviar() {
            var notaVar = nota.value;
            var comentarioVar = comentario.value;
            mensagem_erro.innerHTML = "";
            if (notaVar == 0) {
                mensagem_erro.innerHTML = "Escolha uma nota";
            } else if (comentarioVar == "") {
                const confirmar = confirm("Deseja enviar a nota sem um comentário?");

                if (!confirmar) {
                    return;
                } else {
                    cadastrar();
                }
            } else {
                cadastrar()
            }

            function cadastrar() {
                var notaVar = nota.value;
                var comentarioVar = comentario.value;
                var idUsuarioVar = sessionStorage.getItem("ID_USUARIO")
                var idEscolaVar = sessionStorage.getItem("ID_ESCOLA")
                console.log(idUsuarioVar)

                fetch("/avaliacao/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        notaServer: notaVar,
                        comentarioServer: comentarioVar,
                        idUsuarioServer: idUsuarioVar,
                        idEscolaServer: idEscolaVar
                    }),
                })
                    .then(function (resposta) {
                        console.log("resposta: ", resposta);

                        if (resposta.ok) {
                            mensagem_erro.style.color = "green";
                            mensagem_erro.innerHTML = "Avaliação enviada com sucesso!";
                            const confirmar = confirm("Deseja acessar a Dashboard?");

                            if (!confirmar) {
                                return;
                            } else {
                                setTimeout(() => {
                                    window.location = "dashboard.html";
                                }, "2000");

                                limparFormulario();
                            }
                        } else {
                            throw "Houve um erro ao tentar cadastrar a avaliação!";
                        }


                        function limparFormulario() {
                            nota.value = "";
                            comentario.value = "";
                        }
                    })
                    .catch(function (resposta) {
                        console.log(`#ERRO: ${resposta}`);
                    });

                return false;
            }
        }

        function alterarComentario() {

            var notaVar = nota.value;
            var comentarioVar = comentario.value;
            var idUsuarioVar = sessionStorage.getItem("ID_USUARIO");

            fetch(`/avaliacao/buscar/${idUsuarioVar}`)
                .then(function (resposta) {

                    if (resposta.ok) {

                        resposta.json().then(function (json) {

                            if (json.length == 0) {

                                mensagem_erro.style.color = "red";
                                mensagem_erro.innerHTML = "Você ainda não possui avaliação para atualizar.";

                                return;
                            }

                            fetch("/avaliacao/atualizar", {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    notaServer: notaVar,
                                    descricaoServer: comentarioVar,
                                    idUsuarioServer: idUsuarioVar
                                })
                            })
                                .then(function (resposta) {

                                    if (resposta.ok) {

                                        mensagem_erro.style.color = "green";
                                        mensagem_erro.innerHTML = "Avaliação atualizada com sucesso!";
                                        setTimeout(() => {
                                            location.reload();
                                        }, 2000);

                                    } else {

                                        mensagem_erro.style.color = "red";
                                        mensagem_erro.innerHTML = "Erro ao atualizar avaliação";
                                    }

                                })
                                .catch(function (erro) {

                                    console.log(erro);

                                    mensagem_erro.style.color = "red";
                                    mensagem_erro.innerHTML = "Erro na requisição";
                                });

                        });

                    } else {

                        mensagem_erro.style.color = "red";
                        mensagem_erro.innerHTML = "Erro ao verificar avaliação";
                    }

                })
                .catch(function (erro) {

                    console.log(erro);

                    mensagem_erro.style.color = "red";
                    mensagem_erro.innerHTML = "Erro na requisição";
                });

            return false;
        }

        function deletarComentario() {

            var idUsuarioVar = sessionStorage.getItem("ID_USUARIO");

            fetch(`/avaliacao/buscar/${idUsuarioVar}`)
                .then(function (resposta) {

                    if (resposta.ok) {

                        resposta.json().then(function (json) {

                            if (json.length == 0) {

                                mensagem_erro.style.color = "red";
                                mensagem_erro.innerHTML = "Você não possui avaliação para deletar.";

                                return;
                            }

                            const confirmacao = confirm("Deseja deletar sua avaliação?");

                            if (!confirmacao) {
                                return;
                            }

                            fetch("/avaliacao/deletar", {
                                method: "DELETE",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    idUsuarioServer: idUsuarioVar
                                })
                            })
                                .then(function (resposta) {

                                    if (resposta.ok) {

                                        nota.value = "";
                                        comentario.value = "";

                                        mensagem_erro.style.color = "green";
                                        mensagem_erro.innerHTML = "Avaliação deletada com sucesso!";
                                        setTimeout(() => {
                                            location.reload();
                                        }, 2000);

                                    } else {

                                        mensagem_erro.style.color = "red";
                                        mensagem_erro.innerHTML = "Erro ao deletar avaliação";
                                    }

                                })
                                .catch(function (erro) {

                                    console.log(erro);

                                    mensagem_erro.style.color = "red";
                                    mensagem_erro.innerHTML = "Erro na requisição";
                                });

                        });

                    } else {

                        mensagem_erro.style.color = "red";
                        mensagem_erro.innerHTML = "Erro ao verificar avaliação";
                    }

                })
                .catch(function (erro) {

                    console.log(erro);

                    mensagem_erro.style.color = "red";
                    mensagem_erro.innerHTML = "Erro na requisição";
                });

            return false;
        }
    </script>

</body>


</html>
