<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECTA+ | Meu Perfil</title>

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/perfil-aluno.css">

</head>

<body>
    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="user">
                <img src="assets/imgs/avatar-do-usuario.png" alt="avatar" id="user_avatar">
                <p id="user_infos">
                    <span id="nome_user" class="item-description"></span>
                    <span class="item-description">Aluno</span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="questionario.html">
                        <i class="fi fi-rs-note"></i>
                        <span class="item-description">Avalie</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="dashboard.html">
                        <i class="fi fi-rs-stats"></i>
                        <span class="item-description">Dashboard</span>
                    </a>
                </li>

                <li class="side-item active">
                    <a href="perfil-aluno.html">
                        <i class="fi fi-rs-user"></i>
                        <span class="item-description">Perfil</span>
                    </a>
                </li>
            </ul>

            <button id="abrir">
                <i id="abrir_icon" class="fi fi-rs-angle-small-right"></i>
            </button>


        </div>
        </div>
        <div id="logout">
            <button id="logout_button">
                <i class="fi fi-rs-exit"></i>
                <span class="item-description">Sair</span>
            </button>
        </div>
    </nav>
    <main class="area-perfil">
        <img src="assets/imgs/conecta_logo_transparente.png" alt="" width="150px">
        <section class="cabecalho-perfil">
            <h1>Meu perfil</h1>
            <p>Atualize suas informações pessoais no sistema.</p>
        </section>

        <section class="card-perfil">
            <h2 id="minhasInformacoes">Minhas informações</h2>

            <div class="formulario">
                <div class="linha-dupla">
                    <div class="campo">
                        <span>Nome</span>
                        <input id="nome_input" type="text" placeholder="Nome" disabled>
                    </div>

                    <div class="campo">
                        <span>Sobrenome</span>
                        <input id="sobrenome_input" type="text" placeholder="Sobrenome" disabled>
                    </div>
                </div>

                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="email" placeholder="meuemail@email.com" disabled>
                </div>

                <div class="linha-dupla">
                    <div class="campo">
                        <span>Nova senha</span>
                        <input id="senha_input" type="password" placeholder="Digite uma nova senha" disabled>
                    </div>

                    <div class="campo">
                        <span>Confirmar nova senha</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="Confirme a nova senha"
                            disabled>
                    </div>
                </div>

                <div class="campo">
                    <span>Escola atual:</span>
                    <div class="texto-escola-atual" id="escolaAtualTexto"></div>
                </div>

                <div class="campo">
                    <span>Atualizar escola:</span>
                    <input type="text" id="escolaPerfilInput" placeholder="Digite o nome da escola" disabled>
                    <ul id="sugestoesPerfil"></ul>
                </div>


                <div class="acoes-formulario">
                    <button class="botao" id="btnAlterar" onclick="alterarInformacoes()">Alterar informações</button>
                    <button class="botao" id="btnSalvar" style="display: none;" onclick="salvarAlteracoes()">Salvar
                        alterações</button>
                    <button class="botao" style="background-color: red;" id="btnDeletar" onclick="deletarPerfil()">Deletar
                        perfil</button>
                </div>

                <div id="mensagem_erro" class="msg-validacao"></div>
            </div>
        </section>
    </main>

    <script>

        var inputPerfil = document.getElementById("escolaPerfilInput");
        var sugestoesPerfil = document.getElementById("sugestoesPerfil");

        window.onload = function () {
            var nomeUsuario = sessionStorage.getItem("NOME_USUARIO");
            var sobrenomeUsuario = sessionStorage.getItem("SOBRENOME_USUARIO");
            var nomeCompleto = nomeUsuario + " " + sobrenomeUsuario;
            var emailUsuario = sessionStorage.getItem("EMAIL_USUARIO")
            document.getElementById("nome_user").innerText = nomeCompleto;
            document.getElementById("escolaAtualTexto").innerText = sessionStorage.getItem("ESCOLA_USUARIO");

            nome_input.value = nomeUsuario;
            sobrenome_input.value = sobrenomeUsuario;
            email_input.value = emailUsuario;
        }

        function alterarInformacoes() {
            var nomeUser = nome_input.value;
            var sobrenomeUser = sobrenome_input.value;
            var emailUser = email_input.value;
            var senhaUser = senha_input.value;
            var confirmaSenhaUser = confirmacao_senha_input.value;
            var escolaUser = escolaPerfilInput.value;

            document.getElementById("nome_input").disabled = false;
            document.getElementById("sobrenome_input").disabled = false;
            document.getElementById("email_input").disabled = false;
            document.getElementById("escolaPerfilInput").disabled = false;

            document.getElementById("minhasInformacoes").innerText = "Alterar informações";

            document.getElementById("btnAlterar").style.display = "none";
            document.getElementById("btnSalvar").style.display = "block";
        }


        function salvarAlteracoes() {

            var nomeUser = nome_input.value;
            var sobrenomeUser = sobrenome_input.value;
            var emailUser = email_input.value;
            var senhaUser = senha_input.value;
            var confirmaSenhaUser = confirmacao_senha_input.value;
            var escolaUser = escolaPerfilInput.value;

            mensagem_erro.style.color = "red";

            if (
                nomeUser == "" ||
                sobrenomeUser == "" ||
                emailUser == "" ||
                escolaUser == ""
            ) {
                mensagem_erro.innerHTML = "Preencha todos os campos";
                return;
            }

            if (nomeUser.length < 2) {
                mensagem_erro.innerHTML = "Nome inválido";
                return;
            }

            if (sobrenomeUser.length < 2) {
                mensagem_erro.innerHTML = "Sobrenome inválido";
                return;
            }

            if (
                emailUser.indexOf("@") == -1 ||
                emailUser.indexOf(".") == -1
            ) {
                mensagem_erro.innerHTML = "Email inválido";
                return;
            }

            fetch("/usuarios/atualizar", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: sessionStorage.ID_USUARIO,
                    nome: nomeUser,
                    sobrenome: sobrenomeUser,
                    email: emailUser
                })
            }).then(function (resposta) {

                console.log("ESTOU NO THEN DO ATUALIZAR!");

                if (resposta.ok) {

                    mensagem_erro.style.color = "green";
                    mensagem_erro.innerHTML = "Dados atualizados com sucesso";

                    sessionStorage.setItem("NOME_USUARIO", nomeUser);
                    sessionStorage.setItem("SOBRENOME_USUARIO", sobrenomeUser);
                    sessionStorage.setItem("EMAIL_USUARIO", emailUser);
                    sessionStorage.setItem("ESCOLA_USUARIO", escolaUser);

                    var nomeUsuarioNew = sessionStorage.getItem("NOME_USUARIO");
                    var sobrenomeUsuarioNew = sessionStorage.getItem("SOBRENOME_USUARIO");
                    var nomeCompletoNew = nomeUsuarioNew + " " + sobrenomeUsuarioNew;
                    var emailUsuarioNew = sessionStorage.getItem("EMAIL_USUARIO")
                    document.getElementById("nome_user").innerText = nomeCompletoNew;
                    document.getElementById("escolaAtualTexto").innerText = sessionStorage.getItem("ESCOLA_USUARIO");

                    document.getElementById("minhasInformacoes").innerText = "Minhas informações";

                    document.getElementById("btnAlterar").style.display = "block";
                    document.getElementById("btnSalvar").style.display = "none";



                } else {

                    mensagem_erro.style.color = "red";
                    mensagem_erro.innerHTML = "Erro ao atualizar dados";

                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }

            }).catch(function (erro) {

                console.log(erro);

                mensagem_erro.style.color = "red";
                mensagem_erro.innerHTML = "Erro na requisição";

            });

            return false;
        }

        function deletarPerfil() {
            const confirmacao = confirm("Deseja deletar seu perfil?\nIsso não poderá ser desfeito!")
            if (!confirmacao) {
                return;
            } else {
                fetch("/usuarios/deletar", {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: sessionStorage.ID_USUARIO
                    })
                }).then(function (resposta) {

                    console.log("ESTOU NO THEN DO deletar()!");

                    if (resposta.ok) {

                        sessionStorage.clear();

                        window.location = "/login.html";

                    } else {

                        mensagem_erro.style.color = "red";
                        mensagem_erro.innerHTML = "Erro ao deletar conta";

                        resposta.text().then(texto => {
                            console.error(texto);
                        });
                    }

                }).catch(function (erro) {

                    console.log(erro);

                    mensagem_erro.style.color = "red";
                    mensagem_erro.innerHTML = "Erro na requisição";

                });

                return false;
            }

        }


        inputPerfil.addEventListener("input", function () {
            var valor = inputPerfil.value.toLowerCase();
            sugestoesPerfil.innerHTML = "";

            if (valor === "") {
                return;
            }

            for (var i = 0; i < escolas.length; i++) {
                if (escolas[i].toLowerCase().indexOf(valor) !== -1) {
                    var li = document.createElement("li");
                    li.textContent = escolas[i];

                    li.onclick = function () {
                        inputPerfil.value = this.textContent;
                        sugestoesPerfil.innerHTML = "";
                    };

                    sugestoesPerfil.appendChild(li);
                }
            }
        });
    </script>
    <script src="js/perfil.js"></script>
</body>

</html>
