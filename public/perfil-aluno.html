<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECTA+ | Meu Perfil</title>

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/perfil-aluno.css">
    
</head>

<body>
    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="user">
                <img src="assets/imgs/avatar-do-usuario.png" alt="avatar" id="user_avatar">
                <p id="user_infos">
                    <span id="nome_user" class="item-description"></span>
                    <span class="item-description">Aluno</span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="questionario.html">
                        <i class="fi fi-rs-note"></i>
                        <span class="item-description">Avalie</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="dashboard.html">
                        <i class="fi fi-rs-stats"></i>
                        <span class="item-description">Dashboard</span>
                    </a>
                </li>

                <li class="side-item active">
                    <a href="perfil-aluno.html">
                        <i class="fi fi-rs-user"></i>
                        <span class="item-description">Perfil</span>
                    </a>
                </li>
            </ul>

            <button id="abrir">
                <i id="abrir_icon" class="fi fi-rs-angle-small-right"></i>
            </button>


        </div>
        </div>
        <div id="logout">
            <button id="logout_button">
                <i class="fi fi-rs-exit"></i>
                <span class="item-description">Sair</span>
            </button>
        </div>
    </nav>
    <main class="area-perfil">
        <img src="assets/imgs/conecta_logo_transparente.png" alt="" width="150px">
        <section class="cabecalho-perfil">
            <h1>Meu perfil</h1>
            <p>Atualize suas informações pessoais no sistema.</p>
        </section>

        <section class="card-perfil">
            <h2>Editar informações</h2>

            <div class="formulario">
                <div class="linha-dupla">
                    <div class="campo">
                        <span>Nome</span>
                        <input id="nome_input" type="text" placeholder="Nome">
                    </div>

                    <div class="campo">
                        <span>Sobrenome</span>
                        <input id="sobrenome_input" type="text" placeholder="Sobrenome">
                    </div>
                </div>

                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="email" placeholder="meuemail@email.com">
                </div>

                <div class="linha-dupla">
                    <div class="campo">
                        <span>Nova senha</span>
                        <input id="senha_input" type="password" placeholder="Digite uma nova senha">
                    </div>

                    <div class="campo">
                        <span>Confirmar nova senha</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="Confirme a nova senha">
                    </div>
                </div>

                <div class="campo">
                    <span>Escola atual:</span>
                    <div class="texto-escola-atual" id="escolaAtualTexto"></div>
                </div>

                <div class="campo">
                    <span>Atualizar escola:</span>
                    <input type="text" id="escolaPerfilInput" placeholder="Digite o nome da escola">
                    <ul id="sugestoesPerfil"></ul>
                </div>


                <div class="acoes-formulario">
                    <button class="botao" onclick="salvarAlteracoes()">Salvar alterações</button>
                </div>

                <div id="mensagem_erro" class="msg-validacao"></div>
            </div>
        </section>
    </main>
    
 <script>

  var inputPerfil = document.getElementById("escolaPerfilInput");
  var sugestoesPerfil = document.getElementById("sugestoesPerfil");

  window.onload = function () {
    var nomeUsuario = sessionStorage.getItem("NOME_USUARIO");
    var sobrenomeUsuario = sessionStorage.getItem("SOBRENOME_USUARIO");
    var nomeCompleto = nomeUsuario + " " + sobrenomeUsuario;
    document.getElementById("nome_user").innerText = nomeCompleto;
    document.getElementById("escolaAtualTexto").innerText = sessionStorage.getItem("ESCOLA_USUARIO");
  }

  function salvarAlteracoes() {

    // Limpa mensagens anteriores
    mensagem_erro.innerHTML = "";

    // ================= VALORES DOS INPUTS =================

    var nomeUser = nome_input.value;
    var sobrenomeUser = sobrenome_input.value;
    var emailUser = email_input.value;
    var senhaUser = senha_input.value;
    var confirmaSenhaUser = confirmacao_senha_input.value;
    var escolaUser = escolaPerfilInput.value;

    var idUser = sessionStorage.ID_USUARIO;

    // ================= ARRAY E OBJETO =================

    let campos = [];

    let dadosAtualizacao = {
        id: idUser
    };

    // ================= VALIDAÇÕES =================

    // EMAIL
    if (emailUser != "") {

        if (!emailUser.includes("@") || !emailUser.includes(".")) {

            mensagem_erro.innerHTML = "Digite um e-mail válido!";
            return;

        }

        campos.push("email");
        dadosAtualizacao.email = emailUser;
    }

    // SENHA
    if (senhaUser != "" || confirmaSenhaUser != "") {

        if (senhaUser != confirmaSenhaUser) {

            mensagem_erro.innerHTML = "As senhas não coincidem!";
            return;

        }

        if (senhaUser.length < 6) {

            mensagem_erro.innerHTML = "A senha deve possuir pelo menos 6 caracteres!";
            return;

        }

        campos.push("senha");
        dadosAtualizacao.senha = senhaUser;
    }

    // ESCOLA
    if (escolaUser != "") {

        campos.push("escola");
        dadosAtualizacao.escola = escolaUser;
    }

    // CASO NADA TENHA SIDO ALTERADO
    if (campos.length == 0) {

        mensagem_erro.innerHTML = "Nenhum dado foi alterado!";
        return;

    }

    console.log("Campos alterados:", campos);
    console.log("Dados enviados:", dadosAtualizacao);

    // ================= FETCH =================

    fetch("/usuarios/atualizar", {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(dadosAtualizacao)
    })

    .then(function (resposta) {

        console.log("Resposta recebida!");

        if (resposta.ok) {

            resposta.json().then(json => {

                console.log(json);

                mensagem_erro.style.color = "green";
                mensagem_erro.innerHTML = "Dados atualizados com sucesso!";

                // Atualiza sessionStorage se email mudar
                if (dadosAtualizacao.email) {
                    sessionStorage.EMAIL_USUARIO = dadosAtualizacao.email;
                }

            });

        } else {

            resposta.text().then(texto => {

                console.error(texto);

                mensagem_erro.style.color = "red";
                mensagem_erro.innerHTML = "Erro ao atualizar os dados!";

            });

        }

    })

    .catch(function (erro) {

        console.log(erro);

        mensagem_erro.style.color = "red";
        mensagem_erro.innerHTML = "Erro inesperado!";

    });

}
  

  inputPerfil.addEventListener("input", function () {
    var valor = inputPerfil.value.toLowerCase();
    sugestoesPerfil.innerHTML = "";

    if (valor === "") {
      return;
    }

    for (var i = 0; i < escolas.length; i++) {
      if (escolas[i].toLowerCase().indexOf(valor) !== -1) {
        var li = document.createElement("li");
        li.textContent = escolas[i];

        li.onclick = function () {
          inputPerfil.value = this.textContent;
          sugestoesPerfil.innerHTML = "";
        };

        sugestoesPerfil.appendChild(li);
      }
    }
  });
 </script>
    <script src="js/perfil.js"></script>
</body>

</html>
