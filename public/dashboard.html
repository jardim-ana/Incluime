<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECTA+ | Dashboard</title>

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">

    <link rel="stylesheet" href="./css/perfil-aluno.css">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/dashboards.css">
    <link rel="icon" href="./css/girassol_incluime.png" type="image/png">

</head>

<body>

    <nav id="sidebar">

        <div id="sidebar_content">

            <div id="user">

                <img src="assets/imgs/avatar-do-usuario.png" alt="avatar" id="user_avatar">

                <p id="user_infos">

                    <span id="nome_user" class="item-description">
                    </span>

                    <span id="tipo_user" class="item-description">
                    </span>

                </p>

            </div>

            <ul id="side_items">

                <li class="side-item">

                    <a href="questionario.html">

                        <i class="fi fi-rs-note"></i>

                        <span class="item-description">
                            Avalie
                        </span>

                    </a>

                </li>

                <li class="side-item active">

                    <a href="dashboard.html">

                        <i class="fi fi-rs-stats"></i>

                        <span class="item-description">
                            Dashboard
                        </span>

                    </a>

                </li>

                <li class="side-item">

                    <a href="perfil-aluno.html">

                        <i class="fi fi-rs-user"></i>

                        <span class="item-description">
                            Perfil
                        </span>

                    </a>

                </li>

            </ul>

            <button id="abrir">

                <i id="abrir_icon" class="fi fi-rs-angle-small-right">
                </i>

            </button>

        </div>

        <div id="logout">

            <button id="logout_button">

                <i class="fi fi-rs-exit"></i>

                <span class="item-description">
                    Sair
                </span>

            </button>

        </div>

    </nav>

    <script src="js/perfil.js"></script>

    <div id="corpo">

        <div id="select-superior">

            <div class="select">

                <label for="municipio">
                    Município:
                </label>

                <select name="municipio" id="municipio">

                    <option value="">
                        Selecione um município
                    </option>

                </select>

            </div>

            <div class="select">

                <label for="rede">
                    Rede:
                </label>

                <select name="rede" id="rede">

                    <option value="">
                        Selecione a rede
                    </option>

                </select>

            </div>

            <div class="select">

                <label for="escolas">
                    Escola:
                </label>

                <select name="escolas" id="escolas">

                    <option value="">
                        Selecione a escola
                    </option>

                </select>

            </div>

            <div class="select">

                <label for="ano">
                    Ano:
                </label>

                <select name="ano" id="ano">
                    <option value="">Selecione o ano</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>

            </div>

            <div class="select">

                <label for="deficiencia">
                    Deficiência:
                </label>

                <select name="deficiencia" id="deficiencia">

                    <option value="">
                        Selecione uma deficiência
                    </option>

                    <option value="Física">
                        Física
                    </option>

                    <option value="Visual">
                        Visual
                    </option>

                    <option value="Auditiva">
                        Auditiva
                    </option>

                </select>

            </div>

        </div>

        <div class="kpis">

            <div class="kpi kpi-total-matriculas">

                <h4>
                    Escola Ideal de acordo com seu perfil
                </h4>

                <span class="matriculas">
                    --
                </span>

            </div>

            <div class="kpi kpi-percentual-matriculas">

                <h4>
                    Taxa de variação de Matrículas
                </h4>

                <div class="anos-container">

                    <div class="ano-item">

                        <div class="ano-label">
                            Ano Anterior
                        </div>

                        <div class="ano-valor" id="ano-anterior">

                            --

                        </div>

                    </div>

                    <div class="ano-item">

                        <div class="ano-label">
                            Ano Atual
                        </div>

                        <div class="ano-valor" id="ano-atual">

                            --

                        </div>

                    </div>

                </div>

                <div class="variacao-container">

                    <div class="variacao-wrapper">

                        <span class="variacao-matricula" id="variacao-matricula">

                            --

                        </span>

                        <span class="meta-matricula" id="meta-matricula">

                            Meta: %

                        </span>

                    </div>

                </div>

            </div>

            <div class="kpi kpi-acessibilidade-escola">

                <h4>
                    Índice de acessibilidade
                </h4>

                <span class="acessibilidade">
                    --
                </span>

                <span class="meta-acessibilidade">
                    Meta: --
                </span>
            </div>

        </div>

        <div class="grafico-lista">

            <div class="grafico-linha" style="height:400px;">

                <canvas id="graficoMatriculas"></canvas>

            </div>

            <div class="menor-indicador">

                <h4>
                    Indicador de acessibilidade
                </h4>

                <ul class="lista-situacoes"></ul>


            </div>

        </div>

        <div class="ranking-comentarios">

            <div class="ranking-escolas">

                <h3>
                    Ranking de Escolas
                </h3>

                <hr>

                <ul class="lista-ranking"></ul>

            </div>

            <div class="comentarios-ranking">

                <h3>
                    Comentários da escola
                </h3>

                <hr>

                <div class="comentarios"></div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        let grafico;

        let escolaId = null;

        const municipioSelect =
            document.getElementById("municipio");

        const redeSelect =
            document.getElementById("rede");

        const escolaSelect =
            document.getElementById("escolas");

        const deficienciaSelect =
            document.getElementById(
                "deficiencia"
            );

        const ctx =
            document.getElementById(
                "graficoMatriculas"
            ).getContext("2d");

        window.onload = async function () {

            try {

                const nomeUsuario =
                    sessionStorage.getItem(
                        "NOME_USUARIO"
                    );

                const sobrenomeUsuario =
                    sessionStorage.getItem(
                        "SOBRENOME_USUARIO"
                    );

                const tipoUsuario =
                    sessionStorage.getItem(
                        "TIPO_USUARIO"
                    );

                escolaId =
                    sessionStorage.getItem(
                        "ID_ESCOLA"
                    );

                document.getElementById(
                    "nome_user"
                ).innerText =
                    `${nomeUsuario} ${sobrenomeUsuario}`;

                document.getElementById(
                    "tipo_user"
                ).innerText =
                    tipoUsuario;

                iniciarGrafico();

                if (escolaId) {

                    await carregarDadosIniciaisUsuario();

                } else {

                    await carregarMunicipios();

                }

            } catch (erro) {

                console.error(
                    "Erro no carregamento inicial:",
                    erro
                );
            }
        };

        async function carregarDadosIniciaisUsuario() {

                const resposta =
                    await fetch(
                        `/dashboard/escola/${escolaId}`
                    );

                const escolaUsuario =
                    await resposta.json();

                await carregarMunicipios();

                municipioSelect.value =
                    escolaUsuario.id_municipio_nome;

                await carregarRedes();

                redeSelect.value =
                    escolaUsuario.rede;

                escolaSelect.innerHTML = `
                    <option value="${escolaUsuario.id}">
                        ${escolaUsuario.nome_escola}
                    </option>
                `;

                escolaSelect.value =
                    escolaUsuario.id;

                await atualizarDashboard();

                await atualizarRanking();
            }

        async function carregarMunicipios() {

            try {

                const resposta =
                    await fetch(
                        "/dashboard/municipios"
                    );

                const municipios =
                    await resposta.json();

                municipioSelect.innerHTML =
                    `
                    <option value="">
                        Selecione um município
                    </option>
                    `;

                municipios.forEach(municipio => {

                    municipioSelect.innerHTML += `

                        <option value="${municipio.id_municipio_nome}">
                            ${municipio.id_municipio_nome}
                        </option>

                    `;
                });

            } catch (erro) {

                console.error(
                    "Erro ao carregar municípios:",
                    erro
                );
            }
        }

        async function carregarRedes() {

            try {

                const municipio =
                    municipioSelect.value;

                if (!municipio)
                    return;

                const resposta =
                    await fetch(
                        `/dashboard/redes/${encodeURIComponent(municipio)}`
                    );

                const redes =
                    await resposta.json();

                redeSelect.innerHTML =
                    `
                    <option value="">
                        Selecione a rede
                    </option>
                    `;

                escolaSelect.innerHTML =
                    `
                    <option value="">
                        Selecione a escola
                    </option>
                    `;

                redes.forEach(rede => {

                    redeSelect.innerHTML += `

                        <option value="${rede.rede}">
                            ${rede.rede}
                        </option>

                    `;
                });

            } catch (erro) {

                console.error(
                    "Erro ao carregar redes:",
                    erro
                );
            }
        }

        async function carregarEscolas() {

            const municipio =
                municipioSelect.value;

            const rede =
                redeSelect.value;

            const deficiencia =
                deficienciaSelect.value;

           if (
                !municipio ||
                !rede ||
                !deficiencia
            )
                return;

            const resposta =
                await fetch(

                    `/dashboard/escolas/${encodeURIComponent(municipio)}/${encodeURIComponent(rede)}/${encodeURIComponent(deficiencia)}`

                );

            const escolas =
                await resposta.json();

            escolaSelect.innerHTML =
                `
        <option value="">
            Selecione a escola
        </option>
        `;

            escolas.forEach(escola => {

                escolaSelect.innerHTML += `

            <option value="${escola.id}">
                ${escola.nome_escola}
            </option>

        `;

            });

        }

        async function atualizarDashboard() {

            try {

                escolaId =
                    escolaSelect.value;

                if (!escolaId)
                    return;

                const resposta =
                    await fetch(
                        `/dashboard/dashboard/${escolaId}`
                    );

                const info =
                    await resposta.json();

                atualizarKPIs(info);

                atualizarListaAcessibilidade(info);

                await carregarComentarios(
                    escolaId
                );

                await atualizarRanking();

                atualizarGrafico(
                    info.historico
                );

            } catch (erro) {

                console.error(
                    "Erro ao atualizar dashboard:",
                    erro
                );
            }
        }

        function atualizarKPIs(info) {

            document.querySelector(
                ".acessibilidade"
            ).textContent =
                Number(
                    info.indice_acessibilidade || 0
                ).toFixed(1) + "%";

            document.querySelector(
                ".meta-acessibilidade"
            ).textContent =
                "Meta: " +
                Number(
                    info.meta_acessibilidade || 0
                ).toFixed(1) + "%";

            const historico =
                info.historico || [];

            const anoAtual =
                historico[historico.length - 1];

            const anoAnterior =
                historico[historico.length - 2];

            document.getElementById(
                "ano-atual"
            ).textContent =
                anoAtual?.valor || "--";

            document.getElementById(
                "ano-anterior"
            ).textContent =
                anoAnterior?.valor || "--";

            if (
                anoAtual &&
                anoAnterior &&
                Number(anoAnterior.valor) > 0
            ) {

                const variacao =

                    (
                        (
                            anoAtual.valor -
                            anoAnterior.valor
                        ) /

                        anoAnterior.valor

                    ) * 100;

                const variacaoEl =
                    document.getElementById(
                        "variacao-matricula"
                    );

                variacaoEl.innerHTML = `

                    ${variacao >= 0 ? "↑" : "↓"}

                    ${Math.abs(
                    variacao
                ).toFixed(1)}%

                `;

                variacaoEl.classList.remove(
                    "positivo",
                    "negativo"
                );

                variacaoEl.classList.add(

                    variacao >= 0
                        ? "positivo"
                        : "negativo"
                );
            }
        }

        function atualizarListaAcessibilidade(info) {

            const lista =
                document.querySelector(
                    ".lista-situacoes"
                );

            lista.innerHTML = "";

            const itens = [

                {
                    nome: "Corrimão",
                    valor:
                        info.acessibilidade_corrimao
                },

                {
                    nome: "Elevador",
                    valor:
                        info.acessibilidade_elevador
                },

                {
                    nome: "Pisos Táteis",
                    valor:
                        info.acessibilidade_pisos_tateis
                },

                {
                    nome: "Vão Livre",
                    valor:
                        info.acessibilidade_vao_livre
                },

                {
                    nome: "Rampas",
                    valor:
                        info.acessibilidade_rampas
                },

                {
                    nome: "Sinais Sonoros",
                    valor:
                        info.acessibilidade_sinais_sonoros
                },

                {
                    nome: "Sinal Tátil",
                    valor:
                        info.acessibilidade_sinal_tatil
                },

                {
                    nome: "Sinal Visual",
                    valor:
                        info.acessibilidade_sinal_visual
                },

                {
                    nome: "Acessibilidade Inexistente",
                    valor:
                        info.acessibilidade_inexistente
                }
            ];

            itens.forEach(item => {

                lista.innerHTML += `

                    <li class="
                        item-situacao
                        ${item.valor == 1
                        ? "ativo"
                        : "inativo"}
                    ">

                        <span>
                            ${item.nome}
                        </span>

                        <strong>

                            ${item.valor == 1
                        ? "Disponível"
                        : "Indisponível"}

                        </strong>

                    </li>

                `;
            });
        }

        async function atualizarRanking() {

            const municipio =
                municipioSelect.value;

            const rede =
                redeSelect.value;

            const deficiencia =
                deficienciaSelect.value;

            let url;

            if (
                municipio &&
                rede &&
                deficiencia
            ) {

                url =
                    `/dashboard/ranking/${encodeURIComponent(municipio)}/${encodeURIComponent(rede)}/${encodeURIComponent(deficiencia)}`;

            } else if (municipio) {

                url =
                    `/dashboard/ranking/${encodeURIComponent(municipio)}`;

            } else {

                return;
            }

            const resposta =
                await fetch(url);

            const ranking =
                await resposta.json();

            if (ranking.length > 0) {

                document.querySelector(
                    ".matriculas"
                ).textContent =
                    ranking[0].nome_escola;
            }

            const rankingEl =
                document.querySelector(
                    ".lista-ranking"
                );

            rankingEl.innerHTML = "";

            ranking.forEach((escola, i) => {

                rankingEl.innerHTML += `

                <li>

                    <span class="nome-escola">

                        ${i + 1}º
                        ${escola.nome_escola}

                    </span>

                    <span class="porcentagem">

                        ${Number(
                            escola.indice_acessibilidade
                        ).toFixed(1)}%

                    </span>

                </li>

                `;
            });
        }

        async function carregarComentarios(escolaId) {

            try {

                const resposta =
                    await fetch(
                        `/dashboard/comentarios/${escolaId}`
                    );

                const comentarios =
                    await resposta.json();

                atualizarComentarios(
                    comentarios
                );

            } catch (erro) {

                console.error(
                    "Erro ao carregar comentários:",
                    erro
                );
            }
        }

        function atualizarComentarios(comentarios) {

            const comentariosEl =
                document.querySelector(
                    ".comentarios"
                );

            comentariosEl.innerHTML =

                comentarios.map(c => `

                    <div class="comentario">

                        "${c.descricao}"

                        <span class="nota">

                            Nota:
                            ${c.nota}/5

                        </span>

                    </div>

                `).join("");
        }

        function iniciarGrafico() {

            grafico = new Chart(ctx, {

                type: "line",

                data: {

                    labels: [],

                    datasets: [

                        {
                            label: "Matrículas",

                            data: [],

                            borderColor: "#6a3ecf",

                            fill: false,

                            tension: 0.3,

                            pointRadius: 3
                        }
                    ]
                },

                options: {

                    responsive: true,

                    plugins: {

                        title: {

                            display: true,

                            text:
                                "Gráfico da diferença de matrículas"
                        }
                    }
                }
            });
        }

        function atualizarGrafico(historico) {

            if (
                !historico ||
                !Array.isArray(historico)
            ) {

                console.log(
                    "Histórico inválido:",
                    historico
                );

                return;
            }

            grafico.data.labels =
                historico.map(
                    item => item.ano
                );

            grafico.data.datasets[0].data =
                historico.map(
                    item => item.valor
                );

            grafico.update();
        }

        municipioSelect.addEventListener(
            "change",
            async () => {

                limparDashboard();

                deficienciaSelect.value = "";

                redeSelect.value = "";

                escolaSelect.innerHTML =
                    `
                    <option value="">
                        Selecione a escola
                    </option>
                    `;

                await carregarRedes();
                await atualizarRanking();
            }
        );

        deficienciaSelect.addEventListener(
            "change",
            async () => {

                limparDashboard();

                await carregarEscolas();

                await atualizarRanking();
            }
        );

        redeSelect.addEventListener(
            "change",
            async () => {

                limparDashboard();

                deficienciaSelect.value = "";

                escolaSelect.innerHTML =
                    `
                    <option value="">
                        Selecione a escola
                    </option>
                    `;

                await atualizarRanking();
            }
        );

        escolaSelect.addEventListener(
            "change",
            async () => {

                escolaId =
                    escolaSelect.value;

                await atualizarDashboard();
            }
        );

        function limparDashboard() {

                document.querySelector(".matriculas")
                    .textContent = "--";

                document.querySelector(".acessibilidade")
                    .textContent = "--";

                document.querySelector(".meta-acessibilidade")
                    .textContent = "Meta: --";

                document.getElementById("ano-atual")
                    .textContent = "--";

                document.getElementById("ano-anterior")
                    .textContent = "--";

                document.getElementById("variacao-matricula")
                    .textContent = "--";

                document.querySelector(".lista-situacoes")
                    .innerHTML = "";

                document.querySelector(".comentarios")
                    .innerHTML = "";

                document.querySelector(".lista-ranking")
                    .innerHTML = "";

                grafico.data.labels = [];
                grafico.data.datasets[0].data = [];
                grafico.update();
            }

    </script>

</body>

</html>
